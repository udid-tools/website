name: Release and deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 59.10.0

jobs:
  build:
    name: Build and attest release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      version: ${{ steps.package.outputs.version }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      npm_config_ignore_scripts: "true"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a GitHub-verified signed annotated tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          object_type="$(jq --raw-output '.object.type' <<< "${ref_json}")"
          object_sha="$(jq --raw-output '.object.sha' <<< "${ref_json}")"
          if [[ "${object_type}" != "tag" ]]; then
            echo "Release tags must be signed annotated tags, not lightweight tags." >&2
            exit 1
          fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.verification.verified')" != "true" ]]; then
            echo "GitHub did not verify the release tag signature." >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete verification
        run: npm run verify
      - name: Pull production project settings
        run: npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
      - name: Build the standalone Vercel output once
        env:
          NEXT_PUBLIC_VERCEL_ENV: production
          NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- vercel build --prod --standalone --token="${VERCEL_TOKEN}"
      - name: Require a self-contained Vercel output
        shell: bash
        run: |
          set -euo pipefail
          test -d .vercel/output/functions
          external_reference_count=0
          while IFS= read -r -d '' config; do
            count="$(jq '(.filePathMap // {}) | length' "${config}")"
            if (( count > 0 )); then
              echo "${config} contains ${count} external file references." >&2
              external_reference_count=$((external_reference_count + count))
            fi
          done < <(find .vercel/output/functions -name .vc-config.json -print0)
          if (( external_reference_count > 0 )); then
            echo "Standalone output is not self-contained; refusing to package it." >&2
            exit 1
          fi
      - name: Add production ownership verification files
        env:
          GOOGLE_SITE_VERIFICATION_HTML_CONTENT: ${{ secrets.GOOGLE_SITE_VERIFICATION_HTML_CONTENT }}
          SITE_VERIFICATION_TXT_CONTENT: ${{ secrets.SITE_VERIFICATION_TXT_CONTENT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SITE_VERIFICATION_HTML_CONTENT}"
          test -n "${SITE_VERIFICATION_TXT_CONTENT}"
          test -d .vercel/output/static
          printf '%s\n' "${SITE_VERIFICATION_TXT_CONTENT}" > .vercel/output/static/e67fc0a36f388fc28107bace704aae67029e7c53858f74abbad717c694e31052.txt
          printf '%s\n' "${GOOGLE_SITE_VERIFICATION_HTML_CONTENT}" > .vercel/output/static/googleb9f15617438f045c.html
      - name: Package deterministic release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node --print "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version v${version}." >&2
            exit 1
          fi
          source_date_epoch="$(git show --no-patch --format=%ct "${GITHUB_SHA}")"
          archive="website-v${version}.vercel-output.tar.gz"
          mkdir release
          tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner --create --gzip --file="release/${archive}" --directory=.vercel output
          (cd release && sha256sum "${archive}" > "${archive}.sha256")
          npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > "release/${archive}.sbom.cdx.json"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Sign build provenance with Sigstore
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/${{ steps.package.outputs.archive }}
          subject-version: ${{ steps.package.outputs.version }}
      - name: Sign SBOM attestation with Sigstore
        id: sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/${{ steps.package.outputs.archive }}
          subject-version: ${{ steps.package.outputs.version }}
          sbom-path: release/${{ steps.package.outputs.archive }}.sbom.cdx.json
      - name: Add portable attestation bundles
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "${PROVENANCE_BUNDLE}" "release/${ARCHIVE}.provenance.intoto.jsonl"
          cp "${SBOM_BUNDLE}" "release/${ARCHIVE}.sbom.intoto.jsonl"
      - name: Upload exact release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish signed GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Download exact release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release
      - name: Verify checksum and signed provenance
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd release && sha256sum --check "${ARCHIVE}.sha256")
          gh attestation verify "release/${ARCHIVE}" --repo "${GITHUB_REPOSITORY}"
      - name: Publish release and all verification assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          args=("${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" --draft)
          if [[ "${VERSION}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}" --repo "${GITHUB_REPOSITORY}" release/*
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false

  deploy-production:
    name: Deploy the released artifact to Vercel
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      attestations: read
      contents: read
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      npm_config_ignore_scripts: "true"
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Download the published release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release
      - name: Verify the exact release artifact
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd release && sha256sum --check "${ARCHIVE}.sha256")
          gh attestation verify "release/${ARCHIVE}" --repo "${GITHUB_REPOSITORY}"
      - name: Restore the attested Build Output API directory
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          mkdir .vercel
          tar --extract --gzip --file="release/${ARCHIVE}" --directory=.vercel
      - name: Deploy without rebuilding or promoting
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- vercel deploy --prebuilt --prod --skip-domain --archive=tgz --token="${VERCEL_TOKEN}")"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
      - name: Smoke-test the staged production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          homepage="${RUNNER_TEMP}/homepage.html"
          npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- vercel curl / --deployment="${DEPLOYMENT_URL}" --token="${VERCEL_TOKEN}" -- --fail --silent --show-error --output="${homepage}"
          grep --fixed-strings --quiet "UDID Tools" "${homepage}"
          npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- vercel curl /googleb9f15617438f045c.html --deployment="${DEPLOYMENT_URL}" --token="${VERCEL_TOKEN}" -- --fail --silent --show-error --output=/dev/null
          npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- vercel curl /e67fc0a36f388fc28107bace704aae67029e7c53858f74abbad717c694e31052.txt --deployment="${DEPLOYMENT_URL}" --token="${VERCEL_TOKEN}" -- --fail --silent --show-error --output=/dev/null
      - name: Promote the released deployment to production domains
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- vercel promote "${DEPLOYMENT_URL}" --yes --token="${VERCEL_TOKEN}"
      - name: Verify the public production domain
        shell: bash
        run: |
          set -euo pipefail
          headers="${RUNNER_TEMP}/production-headers.txt"
          robots="${RUNNER_TEMP}/production-robots.txt"
          success_headers="${RUNNER_TEMP}/production-success-headers.txt"
          for attempt in {1..6}; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --dump-header "${headers}" --output=/dev/null https://www.udid.tools/
            if grep --ignore-case --quiet '^cross-origin-opener-policy: same-origin' "${headers}" && ! grep --ignore-case --quiet '^x-powered-by:' "${headers}"; then
              break
            fi
            if (( attempt == 6 )); then
              echo "Production domain still serves the previous deployment." >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error --retry 5 --retry-all-errors --output="${robots}" https://www.udid.tools/robots.txt
          grep --fixed-strings --quiet 'Disallow: /api/' "${robots}"
          grep --fixed-strings --quiet 'Disallow: /success' "${robots}"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --output=/dev/null https://www.udid.tools/googleb9f15617438f045c.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --output=/dev/null https://www.udid.tools/e67fc0a36f388fc28107bace704aae67029e7c53858f74abbad717c694e31052.txt
          curl --silent --show-error --retry 5 --retry-all-errors --dump-header "${success_headers}" --output=/dev/null 'https://www.udid.tools/success?token=invalid-release-smoke-test'
          grep --ignore-case --extended-regexp --quiet '^x-robots-tag:.*noindex' "${success_headers}"
