name: Feature request
description: Propose a focused website or free-tool improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Never include secrets, result links, or real device identifiers.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: The request preserves the privacy and no-account design of the free UDID tool.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility, accessibility, and privacy impact
    validations:
      required: true
